name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpass
          POSTGRES_DB: tasktracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskuser -d tasktracker"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://taskuser:taskpass@localhost:5432/tasktracker
      TEST_DATABASE_URL: postgresql+psycopg://taskuser:taskpass@localhost:5432/tasktracker
      SECRET_KEY: ci-only-secret-key-that-is-at-least-32-bytes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Migrations build the schema from scratch
        run: alembic upgrade head

      - name: Models match migrations
        run: alembic check

      - name: Tests
        run: pytest -q